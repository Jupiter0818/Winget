name: Build and Release Windget

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Configure CMake
      run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

    - name: Build Windget
      run: cmake --build build --config Release

    - name: Archive Distribution Package
      shell: pwsh
      run: |
        tar -a -c -f dist/Windget-windows-x64.zip -C dist Windget.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windget-Windows-x64
        path: dist/Windget.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/Windget.exe
          dist/Windget-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
